[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "changeguard"
version = "0.1.0"
description = "Engineering change impact agent: model investigates, deterministic code enforces."
requires-python = ">=3.11"
dependencies = ["requests>=2.31"]

[project.optional-dependencies]
api = ["fastapi>=0.110", "uvicorn[standard]>=0.29", "pydantic>=2.6"]
postgres = ["psycopg[binary]>=3.1"]
ui = ["streamlit>=1.33"]
otel = ["opentelemetry-sdk>=1.24", "opentelemetry-exporter-otlp-proto-http>=1.24"]
dev = ["pytest>=8", "ruff>=0.4", "mypy>=1.10", "httpx>=0.27", "types-requests"]
all = ["changeguard[api,postgres,ui,otel,dev]"]

[project.scripts]
changeguard = "changeguard.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
changeguard = ["migrations/*.sql"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
line-length = 110
target-version = "py311"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
ignore = ["E501", "B008"]

[tool.mypy]
python_version = "3.11"
ignore_missing_imports = true
check_untyped_defs = true
